---
# What separates this scenario from `default` is the storage backend, so that
# is what it has to prove. PrivateBin falls back to nothing and complains
# about nothing when the database is not configured: it simply keeps writing
# pastes to the filesystem, and every HTTP-level probe keeps passing while
# MariaDB sits unused next to it. That is exactly what this scenario did until
# its `privatebin_config_model` was corrected.
#
# So the paste created here is looked up in MariaDB itself, and the filesystem
# store is asserted to be empty. Neither of those can pass on the filesystem
# backend, and both would fail against an unconfigured PrivateBin image.
- name: Verify PrivateBin with MariaDB
  hosts: all
  become: true
  gather_facts: false

  vars:
    privatebin_verify_base_url: "http://localhost:8080"

    # `privatebin_data_path` is a role default and thus not in scope here.
    privatebin_verify_data_path: /privatebin/data

    # PrivateBin prefixes its tables with the `tbl` setting of config.php.
    privatebin_verify_paste_table: privatebin_paste

    # The shape of an encrypted PrivateBin paste. The server never decrypts
    # any of this; it only validates the envelope, so fixed values are fine.
    privatebin_verify_adata:
      - - "aaaaaaaaaaaaaaaaaaaaaaaa"
        - "bbbbbbbb"
        - 100000
        - 256
        - 128
        - "aes"
        - "gcm"
        - "none"
      - plaintext
      - 0
      - 0

  tasks:
    - name: Wait for MariaDB service to become active (up to 180s)
      ansible.builtin.systemd:
        name: mariadb.service
      register: privatebin_mariadb_service
      until: privatebin_mariadb_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Wait for PrivateBin service to become active (up to 180s)
      ansible.builtin.systemd:
        name: privatebin.service
      register: privatebin_service
      until: privatebin_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    # `Restart=always` in the systemd unit means a crash-looping container
    # still reports `active`, so this is a smoke test and nothing more.
    - name: Assert both services are active
      ansible.builtin.assert:
        that:
          - privatebin_mariadb_service.status.ActiveState == 'active'
          - privatebin_service.status.ActiveState == 'active'
        fail_msg: >-
          mariadb.service is {{ privatebin_mariadb_service.status.ActiveState }},
          privatebin.service is {{ privatebin_service.status.ActiveState }}
        success_msg: "mariadb.service and privatebin.service are active"

    - name: Retrieve PrivateBin service log for debugging
      when: privatebin_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu privatebin.service
      changed_when: false

    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: privatebin_defaults

    - name: Run the checks shared by all PrivateBin scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    # Asked of MariaDB directly, as the very user and database the role handed
    # to PrivateBin, so a wrong credential or a wrong DSN shows up here too.
    # `community.docker` is unavailable in the linting environment this suite
    # runs under, hence the Docker CLI.
    - name: Look the paste up in MariaDB
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mariadb
          - mariadb
          - "--user={{ privatebin_database_mysql_username }}"
          - "--password={{ privatebin_database_mysql_password }}"
          - --skip-column-names
          - --batch
          - "--execute=SELECT COUNT(*) FROM {{ privatebin_verify_paste_table }} WHERE dataid = '{{ privatebin_paste_created.json.id }}'"
          - "{{ privatebin_database_name }}"
      register: privatebin_paste_db_row
      changed_when: false
      failed_when: false

    - name: Assert the paste is stored in MariaDB
      ansible.builtin.assert:
        that:
          - privatebin_paste_db_row.rc == 0
          - (privatebin_paste_db_row.stdout | trim) == '1'
        fail_msg: >-
          {{ privatebin_verify_paste_table }} in the '{{ privatebin_database_name }}' database does not hold
          {{ privatebin_paste_created.json.id }}, so PrivateBin is not using MariaDB
          (rc={{ privatebin_paste_db_row.rc }}, stdout={{ privatebin_paste_db_row.stdout | default('') | trim }},
          stderr={{ privatebin_paste_db_row.stderr | default('') | trim }})
        success_msg: "MariaDB holds the paste as row {{ privatebin_paste_created.json.id }}"

    # And the counterpart: with the database backend in use, PrivateBin keeps
    # nothing at all below the role's data path - not even its salt. A run
    # that had silently fallen back to the filesystem backend would have the
    # paste sitting right here.
    - name: List what the filesystem store holds
      ansible.builtin.find:
        paths: "{{ privatebin_verify_data_path }}"
        recurse: true
        hidden: true
        file_type: file
      register: privatebin_data_path_contents

    - name: Assert nothing was written to the filesystem store
      ansible.builtin.assert:
        that: privatebin_data_path_contents.matched == 0
        fail_msg: >-
          {{ privatebin_verify_data_path }} is not empty
          ({{ privatebin_data_path_contents.files | map(attribute='path') | list }}),
          so PrivateBin fell back to the filesystem storage backend
        success_msg: "The filesystem store is empty - MariaDB is the storage backend in use"

    - name: Run the checks shared by all PrivateBin scenarios (check size limit enforcement)
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks_sizelimit.yml"

    - name: Show the PrivateBin verification summary
      ansible.builtin.debug:
        msg:
          - "PrivateBin systemd: {{ privatebin_service.status.ActiveState }}"
          - "PrivateBin version: {{ privatebin_defaults.privatebin_version }}"
          - "PrivateBin instance name: {{ privatebin_config_main_name }}"
          - "PrivateBin paste: {{ privatebin_paste_created.json.id }}"
          - "PrivateBin rows in MariaDB: {{ privatebin_paste_db_row.stdout | trim }}"
          - "PrivateBin files below {{ privatebin_verify_data_path }}: {{ privatebin_data_path_contents.matched }}"
          - "PrivateBin size limit: {{ privatebin_paste_oversized.json.message | default('no message') }}"
          - "MariaDB systemd: {{ privatebin_mariadb_service.status.ActiveState }}"
