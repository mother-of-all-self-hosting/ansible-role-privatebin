---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: privatebin-${MOLECULE_DISTRO:-ubuntu2604}-mariadb
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        privatebin_debug_service_enabled: false

        # Variables for PrivateBin
        privatebin_uid: 1000
        privatebin_gid: 1000
        privatebin_scheme: http
        privatebin_hostname: localhost
        privatebin_container_labels_traefik_enabled: false
        privatebin_container_http_host_bind_port: 8080

        # An unconfigured PrivateBin image serves a fully working instance of
        # its own, so the verification needs values that only a config.php
        # rendered by this role could have produced. The image calls itself
        # "PrivateBin" and defaults to a 10 MB paste size limit.
        privatebin_config_main_name: MASH Molecule PrivateBin (MariaDB)
        privatebin_config_main_sizelimit: 4096

        # The rate limiter would refuse the second paste that the verification
        # posts before the size limit has a chance to reject it.
        privatebin_config_trafic_limit: 0

        # Variables required for PrivateBin to connect to the MariaDB database (via Unix socket)
        #
        # `privatebin_config_model` is what selects the storage backend. It used
        # to read `privatebin_database_type` here, which is not a variable this
        # role has ever had, so this scenario silently ran on the `filesystem`
        # default with MariaDB deployed alongside but never spoken to.
        privatebin_config_model: mysql
        privatebin_database_mysql_username: my_database_username
        privatebin_database_mysql_password: my_database_password
        privatebin_database_name: privatebin
        privatebin_database_mysql_socket_enabled: true
        privatebin_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
        privatebin_systemd_required_services_list_auto: |
          {{
            (['mariadb.service'])
          }}

        # Variables for MariaDB
        mariadb_uid: 1000
        mariadb_gid: 1000
        mariadb_root_password: mariadb_password
        mariadb_container_unix_socket_enabled: true
        mariadb_managed_databases: |
          {{
            [{
              'name': privatebin_database_name,
              'username': privatebin_database_mysql_username,
              'password': privatebin_database_mysql_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-mariadb
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
