---
# What separates this scenario from `default` is the storage backend, so that
# is what it has to prove. PrivateBin falls back to nothing and complains
# about nothing when the database is not configured: it simply keeps writing
# pastes to the filesystem, and every HTTP-level probe keeps passing while
# MariaDB sits unused next to it. That is exactly what this scenario did until
# its `privatebin_config_model` was corrected.
#
# So the paste created here is looked up in MariaDB itself, and the filesystem
# store is asserted to be empty. Neither of those can pass on the filesystem
# backend, and both would fail against an unconfigured PrivateBin image.
- name: Verify PrivateBin with MariaDB
  hosts: all
  become: true
  gather_facts: false

  vars:
    privatebin_verify_base_url: "http://localhost:8080"

    # `privatebin_data_path` is a role default and thus not in scope here.
    privatebin_verify_data_path: /privatebin/data

    # PrivateBin prefixes its tables with the `tbl` setting of config.php.
    privatebin_verify_paste_table: privatebin_paste

    # The shape of an encrypted PrivateBin paste. The server never decrypts
    # any of this; it only validates the envelope, so fixed values are fine.
    privatebin_verify_adata:
      - - "aaaaaaaaaaaaaaaaaaaaaaaa"
        - "bbbbbbbb"
        - 100000
        - 256
        - 128
        - "aes"
        - "gcm"
        - "none"
      - plaintext
      - 0
      - 0

  tasks:
    - name: Wait for MariaDB service to become active (up to 180s)
      ansible.builtin.systemd:
        name: mariadb.service
      register: privatebin_mariadb_service
      until: privatebin_mariadb_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Wait for PrivateBin service to become active (up to 180s)
      ansible.builtin.systemd:
        name: privatebin.service
      register: privatebin_service
      until: privatebin_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    # `Restart=always` in the systemd unit means a crash-looping container
    # still reports `active`, so this is a smoke test and nothing more.
    - name: Assert both services are active
      ansible.builtin.assert:
        that:
          - privatebin_mariadb_service.status.ActiveState == 'active'
          - privatebin_service.status.ActiveState == 'active'
        fail_msg: >-
          mariadb.service is {{ privatebin_mariadb_service.status.ActiveState }},
          privatebin.service is {{ privatebin_service.status.ActiveState }}
        success_msg: "mariadb.service and privatebin.service are active"

    - name: Retrieve PrivateBin service log for debugging
      when: privatebin_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu privatebin.service
      changed_when: false

    # Read only for `privatebin_version`, the leaf literal that Renovate
    # bumps. Loaded under a name of its own, because a plain `include_vars`
    # outranks this scenario's group_vars and would silently undo them.
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: privatebin_role_defaults

    - name: Wait for the PrivateBin home page to render (up to 10m)
      ansible.builtin.uri:
        url: "{{ privatebin_verify_base_url }}/"
        method: GET
        status_code: [200]
        follow_redirects: none
        return_content: true
      register: privatebin_home_page
      until: privatebin_home_page.status == 200
      retries: 120
      delay: 5

    # The image's own configuration names the instance "PrivateBin" and emits
    # `default-src 'none'` with no `sandbox` directive at all. The parentheses
    # in this scenario's instance name are deliberate: PHP's INI parser
    # reserves them outside of quotes, so this also covers the quoting of
    # config.php.
    - name: Assert the home page was rendered from the role's configuration
      ansible.builtin.assert:
        that:
          - "'<title>' ~ privatebin_config_main_name ~ '</title>' in privatebin_home_page.content"
          - "'default-src &apos;self&apos;' in privatebin_home_page.content"
          - "'sandbox allow-same-origin allow-scripts' in privatebin_home_page.content"
        fail_msg: >-
          The served page does not carry the configuration this role rendered
          (expected the instance name '{{ privatebin_config_main_name }}' and the role's CSP header)
        success_msg: "The served page was rendered from the role's config.php"

    - name: Assert the running PrivateBin is the version the role pins
      ansible.builtin.assert:
        that: "'js/privatebin.js?' ~ privatebin_role_defaults.privatebin_version ~ '\"' in privatebin_home_page.content"
        fail_msg: >-
          The running PrivateBin does not report version
          {{ privatebin_role_defaults.privatebin_version }}
        success_msg: "The running PrivateBin reports version {{ privatebin_role_defaults.privatebin_version }}"

    # A ciphertext of letters and digits only, so that it is valid base64 and
    # PrivateBin accepts it. Generated once and reused, so that the value that
    # goes in can be compared with the value that comes back out.
    - name: Generate a ciphertext to paste
      ansible.builtin.set_fact:
        privatebin_verify_ct: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=1024) }}"

    # PrivateBin creates its tables the first time it talks to the database,
    # so this single request also exercises the schema creation.
    - name: Create a paste through the PrivateBin API
      ansible.builtin.uri:
        url: "{{ privatebin_verify_base_url }}/"
        method: POST
        headers:
          X-Requested-With: JSONHttpRequest
        body_format: json
        body:
          v: 2
          adata: "{{ privatebin_verify_adata }}"
          ct: "{{ privatebin_verify_ct }}"
          meta:
            expire: 5min
        status_code: [200]
        return_content: true
      register: privatebin_paste_created
      changed_when: true

    - name: Assert the paste was accepted
      ansible.builtin.assert:
        that:
          - privatebin_paste_created.json.status == 0
          - privatebin_paste_created.json.id | default('') | length > 0
        fail_msg: "PrivateBin refused the paste: {{ privatebin_paste_created.json | default('no payload') }}"
        success_msg: "PrivateBin stored a paste as {{ privatebin_paste_created.json.id | default('?') }}"

    - name: Read the paste back through the PrivateBin API
      ansible.builtin.uri:
        url: "{{ privatebin_verify_base_url }}/?pasteid={{ privatebin_paste_created.json.id }}"
        method: GET
        headers:
          X-Requested-With: JSONHttpRequest
        status_code: [200]
        return_content: true
      register: privatebin_paste_read

    - name: Assert the paste came back unchanged
      ansible.builtin.assert:
        that:
          - privatebin_paste_read.json.status == 0
          - privatebin_paste_read.json.ct == privatebin_verify_ct
        fail_msg: "The paste did not come back as it went in: {{ privatebin_paste_read.json | default('no payload') }}"
        success_msg: "The paste round-tripped through PrivateBin unchanged"

    # Asked of MariaDB directly, as the very user and database the role handed
    # to PrivateBin, so a wrong credential or a wrong DSN shows up here too.
    # `community.docker` is unavailable in the linting environment this suite
    # runs under, hence the Docker CLI.
    - name: Look the paste up in MariaDB
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mariadb
          - mariadb
          - "--user={{ privatebin_database_mysql_username }}"
          - "--password={{ privatebin_database_mysql_password }}"
          - --skip-column-names
          - --batch
          - "--execute=SELECT COUNT(*) FROM {{ privatebin_verify_paste_table }} WHERE dataid = '{{ privatebin_paste_created.json.id }}'"
          - "{{ privatebin_database_name }}"
      register: privatebin_paste_db_row
      changed_when: false
      failed_when: false

    - name: Assert the paste is stored in MariaDB
      ansible.builtin.assert:
        that:
          - privatebin_paste_db_row.rc == 0
          - (privatebin_paste_db_row.stdout | trim) == '1'
        fail_msg: >-
          {{ privatebin_verify_paste_table }} in the '{{ privatebin_database_name }}' database does not hold
          {{ privatebin_paste_created.json.id }}, so PrivateBin is not using MariaDB
          (rc={{ privatebin_paste_db_row.rc }}, stdout={{ privatebin_paste_db_row.stdout | default('') | trim }},
          stderr={{ privatebin_paste_db_row.stderr | default('') | trim }})
        success_msg: "MariaDB holds the paste as row {{ privatebin_paste_created.json.id }}"

    # And the counterpart: with the database backend in use, PrivateBin keeps
    # nothing at all below the role's data path - not even its salt. A run
    # that had silently fallen back to the filesystem backend would have the
    # paste sitting right here.
    - name: List what the filesystem store holds
      ansible.builtin.find:
        paths: "{{ privatebin_verify_data_path }}"
        recurse: true
        hidden: true
        file_type: file
      register: privatebin_data_path_contents

    - name: Assert nothing was written to the filesystem store
      ansible.builtin.assert:
        that: privatebin_data_path_contents.matched == 0
        fail_msg: >-
          {{ privatebin_verify_data_path }} is not empty
          ({{ privatebin_data_path_contents.files | map(attribute='path') | list }}),
          so PrivateBin fell back to the filesystem storage backend
        success_msg: "The filesystem store is empty - MariaDB is the storage backend in use"

    # The size limit comes from this scenario's group_vars and is far below
    # the 10 MB the image defaults to, so its enforcement is a second, and
    # independent, proof that config.php reached the running process.
    - name: Attempt a paste larger than the configured size limit
      ansible.builtin.uri:
        url: "{{ privatebin_verify_base_url }}/"
        method: POST
        headers:
          X-Requested-With: JSONHttpRequest
        body_format: json
        body:
          v: 2
          adata: "{{ privatebin_verify_adata }}"
          ct: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=20000) }}"
          meta:
            expire: 5min
        status_code: [200]
        return_content: true
      register: privatebin_paste_oversized
      changed_when: false

    - name: Assert the configured size limit is enforced
      ansible.builtin.assert:
        that:
          - privatebin_paste_oversized.json.status == 1
          - "'limited' in (privatebin_paste_oversized.json.message | default('') | lower)"
        fail_msg: >-
          A paste larger than privatebin_config_main_sizelimit
          ({{ privatebin_config_main_sizelimit }}) was accepted:
          {{ privatebin_paste_oversized.json | default('no payload') }}
        success_msg: >-
          PrivateBin enforced the configured size limit
          ({{ privatebin_paste_oversized.json.message | default('no message') }})

    - name: Show PrivateBin verification summary
      ansible.builtin.debug:
        msg:
          - "PrivateBin systemd: {{ privatebin_service.status.ActiveState }}"
          - "MariaDB systemd: {{ privatebin_mariadb_service.status.ActiveState }}"
          - "PrivateBin version: {{ privatebin_role_defaults.privatebin_version }}"
          - "Instance name: {{ privatebin_config_main_name }}"
          - "Paste: {{ privatebin_paste_created.json.id }}"
          - "Rows in MariaDB: {{ privatebin_paste_db_row.stdout | trim }}"
          - "Files below {{ privatebin_verify_data_path }}: {{ privatebin_data_path_contents.matched }}"
          - "Size limit: {{ privatebin_paste_oversized.json.message | default('no message') }}"
